name: Release - Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  BACKEND_REPOSITORY: eks-platform-dev-backend
  FRONTEND_REPOSITORY: eks-platform-dev-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: |
          docker build -t "${{ steps.login-ecr.outputs.registry }}/${BACKEND_REPOSITORY}:${IMAGE_TAG}" ./backend

      - name: Push backend image
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${BACKEND_REPOSITORY}:${IMAGE_TAG}"

      - name: Build frontend image
        run: |
          docker build -t "${{ steps.login-ecr.outputs.registry }}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}" ./frontend

      - name: Push frontend image
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}"
